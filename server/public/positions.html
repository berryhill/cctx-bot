<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Positions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: monospace;
            background: #1a1a1a;
            color: #00ff00;
            padding: 20px;
        }
        h1 {
            margin-bottom: 20px;
            text-align: center;
        }
        .status {
            text-align: center;
            margin-bottom: 10px;
            font-size: 12px;
        }
        .status.connected {
            color: #00ff00;
        }
        .status.disconnected {
            color: #ff0000;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #0a0a0a;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border: 1px solid #333;
        }
        th {
            background: #222;
            color: #00ffff;
            position: sticky;
            top: 0;
        }
        tr:hover {
            background: #1a2a1a;
        }
        .long {
            color: #00ff00;
        }
        .short {
            color: #ff6666;
        }
        .spot {
            color: #ffaa00;
        }
        .futures {
            color: #00aaff;
        }
        .no-data {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        /* Log Viewer Styles */
        .log-viewer {
            margin-top: 30px;
            background-color: #0a0a0a;
            border: 1px solid #333;
            border-radius: 4px;
            overflow: hidden;
            font-family: monospace;
        }
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background-color: #222;
            border-bottom: 1px solid #333;
        }
        .log-header h3 {
            margin: 0;
            color: #00ffff;
            font-size: 14px;
        }
        .log-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .log-status {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 3px;
        }
        .log-status.connected {
            background-color: #28a745;
            color: white;
        }
        .log-status.disconnected {
            background-color: #dc3545;
            color: white;
        }
        .auto-scroll-label {
            color: #ccc;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        .clear-btn {
            background-color: #444;
            color: #ccc;
            border: none;
            padding: 4px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }
        .clear-btn:hover {
            background-color: #555;
        }
        .log-container {
            height: 300px;
            overflow-y: auto;
            padding: 8px;
            font-size: 12px;
            line-height: 1.4;
        }
        .log-entry {
            padding: 2px 0;
            white-space: pre-wrap;
            word-break: break-all;
            color: #00ff00;
        }
        .log-timestamp {
            color: #888;
            margin-right: 8px;
        }
        .log-service {
            color: #00ffff;
            margin-right: 4px;
        }
        .log-type {
            color: #ffaa00;
            margin-right: 8px;
        }
        .log-message {
            color: #00ff00;
        }
        .log-error {
            background-color: rgba(220, 53, 69, 0.15);
        }
        .log-error .log-message {
            color: #ff6666;
        }
        .log-warn {
            background-color: rgba(255, 193, 7, 0.1);
        }
        .log-warn .log-message {
            color: #ffaa00;
        }
        .log-container::-webkit-scrollbar {
            width: 8px;
        }
        .log-container::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        .log-container::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>📊 Open Positions</h1>
    <div class="status disconnected" id="status">⚫ Disconnected</div>

    <div id="balances-container" style="margin-bottom: 20px;"></div>

    <table id="positions-table">
        <thead>
            <tr>
                <th>Tag</th>
                <th>Account</th>
                <th>Symbol</th>
                <th>Side</th>
                <th>Market</th>
                <th>Contracts</th>
                <th>Avg Price</th>
                <th>Dollar Amount</th>
                <th>Trades</th>
                <th>First Opened</th>
                <th>Last Updated</th>
            </tr>
        </thead>
        <tbody id="positions-body">
            <tr><td colspan="11" class="no-data">Loading...</td></tr>
        </tbody>
    </table>

    <!-- Log Viewer -->
    <div class="log-viewer">
        <div class="log-header">
            <h3>Server Logs</h3>
            <div class="log-controls">
                <span class="log-status disconnected" id="log-status">Disconnected</span>
                <label class="auto-scroll-label">
                    <input type="checkbox" id="auto-scroll" checked>
                    Auto-scroll
                </label>
                <button class="clear-btn" id="clear-logs">Clear</button>
            </div>
        </div>
        <div class="log-container" id="log-container"></div>
    </div>

    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}/positions-ws`);
        const statusEl = document.getElementById('status');
        const tbody = document.getElementById('positions-body');

        ws.onopen = () => {
            statusEl.textContent = '🟢 Connected';
            statusEl.className = 'status connected';
        };

        ws.onclose = () => {
            statusEl.textContent = '🔴 Disconnected';
            statusEl.className = 'status disconnected';
            setTimeout(() => window.location.reload(), 3000);
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            console.log('WebSocket data received:', data);

            // Handle both old format (array) and new format (object with positions + balances)
            if (Array.isArray(data)) {
                console.log('Received old format (array)');
                renderPositions(data);
            } else {
                console.log('Received new format (object)');
                console.log('Positions:', data.positions);
                console.log('Balances:', data.balances);
                renderPositions(data.positions || []);
                renderBalances(data.balances || {});
            }
        };

        function renderBalances(balances) {
            const container = document.getElementById('balances-container');

            if (Object.keys(balances).length === 0) {
                container.innerHTML = '';
                return;
            }

            const balanceCards = Object.entries(balances).map(([username, balance]) => {
                return `
                    <div style="display: inline-block; background: #0a0a0a; border: 1px solid #333; padding: 15px; margin: 5px; border-radius: 5px;">
                        <div style="color: #00ffff; font-weight: bold; margin-bottom: 8px;">${username}</div>
                        <div style="font-size: 12px;">
                            <div style="margin: 3px 0;">Wallet: <span style="color: #00ff00;">${balance.walletBalance.toFixed(8)} BTC</span></div>
                            <div style="margin: 3px 0;">Margin: <span style="color: #ffaa00;">${balance.marginBalance.toFixed(8)} BTC</span></div>
                            <div style="margin: 3px 0;">Available: <span style="color: #00aaff;">${balance.availableMargin.toFixed(8)} BTC</span></div>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = balanceCards;
        }

        function renderPositions(positions) {
            if (positions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="11" class="no-data">No open positions</td></tr>';
                return;
            }

            tbody.innerHTML = positions.map(pos => {
                const sideClass = pos.side === 'B' || pos.side === 'LF' ? 'long' : 'short';
                const marketClass = pos.market_type === 'spot' ? 'spot' : 'futures';
                const dollarAmount = pos.dollar_amount ? `$${pos.dollar_amount.toFixed(2)}` : '-';

                return `
                    <tr>
                        <td>${pos.tag}</td>
                        <td>${pos.account}</td>
                        <td>${pos.symbol}</td>
                        <td class="${sideClass}">${pos.side}</td>
                        <td class="${marketClass}">${pos.market_type}</td>
                        <td>${pos.total_contracts.toFixed(4)}</td>
                        <td>${pos.average_price.toFixed(4)}</td>
                        <td>${dollarAmount}</td>
                        <td>${pos.trade_count}</td>
                        <td>${new Date(pos.first_opened).toLocaleString()}</td>
                        <td>${new Date(pos.last_updated).toLocaleString()}</td>
                    </tr>
                `;
            }).join('');
        }

        // ========== LOG VIEWER ==========
        const logContainer = document.getElementById('log-container');
        const logStatusEl = document.getElementById('log-status');
        const autoScrollCheckbox = document.getElementById('auto-scroll');
        const clearLogsBtn = document.getElementById('clear-logs');
        let logs = [];
        const MAX_LOGS = 1000;

        const logsWs = new WebSocket(`${protocol}//${window.location.host}/logs-ws`);

        logsWs.onopen = () => {
            logStatusEl.textContent = 'Connected';
            logStatusEl.className = 'log-status connected';
        };

        logsWs.onclose = () => {
            logStatusEl.textContent = 'Disconnected';
            logStatusEl.className = 'log-status disconnected';
        };

        logsWs.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'history') {
                logs = data.logs;
                renderLogs();
            } else if (data.type === 'log') {
                logs.push(data.log);
                if (logs.length > MAX_LOGS) logs.shift();
                appendLog(data.log);
            }
        };

        function formatTimestamp(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleTimeString('en-US', {
                hour12: false,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            }) + '.' + String(date.getMilliseconds()).padStart(3, '0');
        }

        function getLogClass(level) {
            if (level === 'error') return 'log-entry log-error';
            if (level === 'warn') return 'log-entry log-warn';
            return 'log-entry';
        }

        function createLogElement(log) {
            const div = document.createElement('div');
            div.className = getLogClass(log.level);
            div.innerHTML = `<span class="log-timestamp">${formatTimestamp(log.timestamp)}</span><span class="log-service">[${log.service}]</span><span class="log-type">&lt;${log.type}&gt;</span><span class="log-message">${log.message}</span>`;
            return div;
        }

        function renderLogs() {
            logContainer.innerHTML = '';
            logs.forEach(log => logContainer.appendChild(createLogElement(log)));
            if (autoScrollCheckbox.checked) {
                logContainer.scrollTop = logContainer.scrollHeight;
            }
        }

        function appendLog(log) {
            logContainer.appendChild(createLogElement(log));
            if (autoScrollCheckbox.checked) {
                logContainer.scrollTop = logContainer.scrollHeight;
            }
        }

        clearLogsBtn.addEventListener('click', () => {
            logs = [];
            logContainer.innerHTML = '';
        });
    </script>
</body>
</html>
