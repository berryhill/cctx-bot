# Production environment values

# MongoDB configuration
mongodb:
  name: ccxt-bot-mongodb
  image:
    repository: mongo
    tag: "5.0"
    pullPolicy: IfNotPresent
  database: ccxt-bot
  rootUsername: root
  rootPassword: "CHANGE_ME_IN_PRODUCTION"  # Override this with --set or use secrets management
  storage:
    dataSize: 20Gi
    configSize: 2Gi
    storageClass: ""  # Use default storage class or specify your SSD storage class

# Server configuration
server:
  name: ccxt-bot-server
  replicaCount: 3  # Multiple replicas for high availability
  environment: "production"
  image:
    repository: ccxt-bot-server  # Update with your registry (e.g., gcr.io/project/ccxt-bot-server)
    tag: "latest"  # Should be overridden with specific version tag in CI/CD
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

# Ingress configuration
ingress:
  enabled: true
  name: ccxt-bot-ingress
  className: nginx
  host: ccxt-bot.example.com  # Update with your production domain
  tls:
    enabled: true
    clusterIssuer: "letsencrypt-prod"
  annotations: {}
