# Development environment values

# MongoDB configuration
mongodb:
  name: ccxt-bot-mongodb
  image:
    repository: mongo
    tag: "5.0"
    pullPolicy: IfNotPresent
  database: ccxt-bot
  rootUsername: root
  rootPassword: "NLfkP9w4524k38YSdrUtJrTlyXDmNs62N9A8DeJi"  # Change in production!
  storage:
    dataSize: 5Gi
    configSize: 1Gi
    storageClass: ""  # Use default storage class

# Server configuration
server:
  name: ccxt-bot-server
  replicaCount: 1  # Single replica for dev
  environment: "development"
  image:
    repository: ccxt-bot-server  # Update with your registry
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000
  doppler:
    enabled: true  # Enable Doppler for development
    token: ""  # Set via --set server.doppler.token or CI/CD
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# Ingress configuration
ingress:
  enabled: true
  name: ccxt-bot-ingress
  className: nginx
  host: dev.ccxt-bot.example.com  # Update with your domain
  tls:
    enabled: true
    clusterIssuer: "letsencrypt-prod"
  annotations: {}
