apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.mongodb.name }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app: {{ .Values.mongodb.name }}
spec:
  type: ClusterIP
  ports:
    - port: 27017
      targetPort: 27017
      name: mongodb
  selector:
    app: {{ .Values.mongodb.name }}
