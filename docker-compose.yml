version: '3.8'

services:
  mongodb:
    image: mongo:5.0
    container_name: ccxt-bot-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ccxt-bot
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - ccxt-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ccxt-bot-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - ENV=${ENV:-workstation}  # Set to 'workstation' for local dev, or 'production' for deployed
      - DB_URL=mongodb://root:${MONGO_ROOT_PASSWORD}@mongodb:27017/ccxt-bot?authSource=admin&retryWrites=true&w=majority
      - DOPPLER_TOKEN=${DOPPLER_TOKEN:-}  # Optional: set for Doppler mode
    volumes:
      # Mount the React build if you want to update it without rebuilding
      - ./client/build:/app/build
      # Mount .env for workstation mode (optional)
      - ./server/.env:/app/.env:ro
    networks:
      - ccxt-network
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  ccxt-network:
    driver: bridge
