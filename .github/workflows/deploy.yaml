name: Deploy CCXT Bot

on:
  push:
    branches:
      - 'dev'
      - 'prod'

env:
  NAME: ccxt-bot
  DOCKER_REGISTRY: ghcr.io
  DOCKER_ORG: berryhill
  DOCKER_TAG: 0.0.17
  GITHUB_USER: berryhill
  GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
  LINODE_KUBECONFIG: ${{ secrets[format('{0}_LINODE_KUBECONFIG', github.ref_name)] }}
  DOPPLER_TOKEN: ${{ secrets[format('{0}_DOPPLER_TOKEN', github.ref_name)] }}

jobs:
  build-push-server:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/prod'

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ env.GITHUB_USER }}
        password: ${{ env.GHCR_TOKEN }}

    - name: Build and push server Docker image
      run: |
        docker build \
          -t ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_ORG }}/ccxt-bot-server:${{ env.DOCKER_TAG }} \
          -t ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_ORG }}/ccxt-bot-server:latest \
          -f server/Dockerfile \
          ./server
        docker push ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_ORG }}/ccxt-bot-server:${{ env.DOCKER_TAG }}
        docker push ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_ORG }}/ccxt-bot-server:latest

  deploy:
    needs: [build-push-server]
    runs-on: ubuntu-latest
    if: always() && needs.build-push-server.result == 'success'

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Debug - Check secret availability
      run: |
        echo "Branch name: ${{ github.ref_name }}"
        if [ -z "$LINODE_KUBECONFIG" ]; then
          echo "ERROR: LINODE_KUBECONFIG is empty!"
          echo "Expected secret name: LINODE_KUBECONFIG_${{ github.ref_name }}"
          exit 1
        else
          echo "✓ LINODE_KUBECONFIG is set (length: ${#LINODE_KUBECONFIG})"
        fi
      env:
        LINODE_KUBECONFIG: ${{ env.LINODE_KUBECONFIG }}

    - name: Set up Kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "$LINODE_KUBECONFIG" | base64 -d > ~/.kube/config
        chmod 600 ~/.kube/config
        echo "✓ Kubeconfig written and permissions set"
      env:
        LINODE_KUBECONFIG: ${{ env.LINODE_KUBECONFIG }}

    - name: Verify Kubernetes connection
      run: |
        echo "Testing kubectl connection..."
        kubectl version --client
        kubectl cluster-info
        kubectl get nodes

    - name: Set up Helm
      uses: azure/setup-helm@v3

    - name: Deploy server using Helm
      run: |
        helm upgrade --install ccxt-bot ./helm \
          -f ./helm/values-${{ github.ref_name }}.yaml \
          --set dopplerToken="${{ env.DOPPLER_TOKEN }}" \
          --set image.repository="${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_ORG }}/ccxt-bot-server" \
          --set image.tag="${{ env.DOCKER_TAG }}" \
          --set environment="${{ github.ref_name }}" \
          --wait

    - name: Wait for deployment to be ready
      run: |
        kubectl rollout status deployment/ccxt-bot --timeout=5m

    - name: Get deployment status
      run: |
        echo "📊 Deployment Status:"
        kubectl get all
        echo ""
        echo "🌐 Ingress URLs:"
        kubectl get ingress -o custom-columns=NAME:.metadata.name,HOSTS:.spec.rules[*].host || echo "No ingress configured"
        echo ""
        echo "📦 Image deployed:"
        echo "${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_ORG }}/ccxt-bot-server:${{ env.DOCKER_TAG }}"
